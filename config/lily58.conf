# 啟用 ZMK 藍牙
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BATTERY_REPORTING=y

# 分體式鍵盤支援
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_KEYBOARD_NAME="Tom-Split-KB"

# 啟用省電功能
CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_IDLE_TIMEOUT=180000
CONFIG_ZMK_EXT_POWER=n

# 系統設定
CONFIG_ZMK_SETTINGS_RESET_ON_START=n

# 啟用 ZMK 實驗性 BLE 連線引擎（大幅改善 macOS 休眠與重連穩定度）
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 停用 2M PHY（強制使用 1M PHY，避免 macOS 喚醒時 2M 訊號協商失敗）
CONFIG_BT_CTLR_PHY_2M=n

# 提高藍牙發射功率 (+8dBm)，增強喚醒時與 Mac 的握手訊號
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 避免喚醒時 GATT 訂閱強制驗證失敗
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# 啟用全部 Consumer 鍵碼（解除 0xFF 上限）
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
